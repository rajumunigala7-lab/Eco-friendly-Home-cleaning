<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Eco-Friendly</title>

    <link rel="stylesheet" href="header.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

<!-- =====================================================
     HEADER
===================================================== -->

<header class="navbar">

    <div class="container nav-container">

        <!-- =================================================
             LOGO
        ================================================== -->

        <a href="index.html" class="logo">

            <span class="logo-mark">
                <img
                    src="./img/logo.png"
                    alt="EcoNest Logo"
                    class="logo-img">
            </span>

            <span class="logo-eco">Eco</span>
            <span class="logo-nest">Nest</span>

        </a>


        <!-- =================================================
             NAVIGATION
        ================================================== -->

        <nav class="nav-menu" id="navMenu">

            <!-- HOME DROPDOWN -->

            <div class="dropdown">

                <a href="#" class="dropdown-toggle">

                    <span>Home</span>

                    <i class="fa-solid fa-chevron-down"></i>

                </a>

                <ul class="dropdown-menu">

                    <li>
                        <a href="index.html">
                            <i class="fa-solid fa-house"></i>
                            Home 1
                        </a>
                    </li>

                    <li>
                        <a href="home2.html">
                            <i class="fa-solid fa-house"></i>
                            Home 2
                        </a>
                    </li>

                </ul>

            </div>


            <!-- NAV LINKS -->

            <a href="services.html">
                Services
            </a>

            <a href="about.html">
                About
            </a>

            <a href="Gallery.html">
                Gallery
            </a>

            <a href="Pricing.html">
                Pricing
            </a>

            <a href="blog.html" class="active">
                Blog
            </a>

            <a href="contact.html">
                Contact
            </a>

            <a href="dasboard.html">
                Dashboard
            </a>

        </nav>


        <!-- =================================================
             NAV ACTIONS
        ================================================== -->

        <div class="nav-actions">

            <!-- RTL / LTR BUTTON -->

            <button
                class="icon-button"
                id="rtlToggle"
                type="button"
                title="Switch RTL / LTR"
                aria-label="Switch RTL / LTR">

                <i class="fa-solid fa-arrows-left-right"></i>

                <span id="directionText">RTL</span>

            </button>


            <!-- DARK / LIGHT MODE -->

            <button
                class="icon-button"
                id="themeToggle"
                type="button"
                title="Toggle dark mode"
                aria-label="Toggle dark mode">

                <i class="fa-solid fa-moon"></i>

            </button>


            <!-- LOGIN -->

            <a
                href="login.html"
                class="login-btn">

                Login

                <i class="fa-solid fa-arrow-right"></i>

            </a>


            <!-- MOBILE MENU -->

            <button
                class="mobile-menu-button"
                id="mobileMenuButton"
                type="button"
                aria-label="Open navigation menu"
                aria-expanded="false">

                <i class="fa-solid fa-bars"></i>

            </button>

        </div>

    </div>

</header>


<!-- =====================================================
     JAVASCRIPT
===================================================== -->

<script src="./header.js"></script>

</body>
</html>
